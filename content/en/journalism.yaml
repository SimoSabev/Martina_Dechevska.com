heading: Selected writing.
intro: >-
  From the United Nations to New York Fashion Week — reporting for bTV and BNT,
  building ZoomIn.TV's New York bureau, and writing for VICE, Maxim, Dnevnik
  and The Upcoming.
archiveTitle: Flowers in a Gun
archiveText: >-
  The independent New York music blog Martina founded and edited, named after
  The Libertines' "The Boys in the Band" — a collective of writers and
  photographers documenting the city's independent music scene. Now preparing
  for its revival.
archiveYears: 2013 – 2016
videosTitle: Reporting from New York.
videosIntro: >-
  Television and video reports from New York for bTV and for ZoomIn.TV, whose
  New York bureau Martina established.
