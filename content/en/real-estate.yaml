heading: Beyond properties. Beyond expectations.
intro: >-
  Martina represents buyers, sellers, landlords and investors across New York
  City's five boroughs, with a particular focus on Manhattan and Brooklyn —
  combining market expertise with an instinct for people, properties and
  negotiation.
photo: /images/real-estate/photo.jpg
photoAlt: >-
  Martina Dechevska with a colleague from The Empire Team outside a New York
  brownstone
