services:
  - title: Buying
    description: >-
      From first homes to luxury residences. As a Certified Buyer
      Representative, Martina negotiates on her clients' side — and her
      relationships with New York landlords and owners open doors beyond the
      usual listing platforms.
  - title: Selling
    description: >-
      Pricing, positioning and presentation that make a property stand out, with
      an editor's eye for the story that makes every home distinctive.
  - title: Landlords & leasing
    description: >-
      Exclusive building representation, marketing and leasing for property
      owners, built on years of work with New York's residential rental market.
  - title: Investment
    description: >-
      Identifying undervalued opportunities, negotiating favourable terms and
      repositioning properties for the market.
  - title: International clients
    description: >-
      Work in Bulgarian, English, French and Spanish, plus introductions to
      off-market and international real estate through a network that spans
      several countries.
