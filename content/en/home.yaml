tagline: Between worlds. Between words. Beyond the frame.
intro: >-
  Born in Plovdiv, Bulgaria, and based in New York, Martina Dechevska is an
  Associate Real Estate Broker and the founder of The Empire Team at Find Real
  Estate — and a journalist and novelist whose reporting has taken her from the
  United Nations to New York Fashion Week.
portrait: /images/home/portrait.webp
portraitAlt: >-
  Martina Dechevska in a green tweed suit on the steps of a New York
  brownstone
statement: An observer by nature. A journalist by profession. A storyteller at heart.
journalismTitle: Journalism
journalismText: >-
  US correspondent for bTV, reporter for BNT's BuntART, founder of ZoomIn.TV's
  New York bureau, and writing for VICE, Maxim and Dnevnik.
literatureTitle: Literature
literatureText: >-
  S@MOT@, a genre-bending debut novel, and new fiction written in English.
realEstateTitle: Real Estate
realEstateText: >-
  Buyers, sellers, landlords and investors across New York City's five
  boroughs, with a focus on Manhattan and Brooklyn.
